<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室登録 - 入室通知システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>教室登録</h1>
        <p class="subtitle">入室通知システム</p>

        <div class="info">
            新しい教室を登録します。登録後すぐにシステムをご利用いただけます。
        </div>

        <div id="message" class="message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">教室名 *</label>
                <input type="text" id="name" required placeholder="例: さくら学習塾">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス *</label>
                <input type="email" id="email" required placeholder="classroom@example.com">
            </div>

            <div class="form-group">
                <label for="password">パスワード *</label>
                <input type="password" id="password" required placeholder="パスワードを入力" minlength="6">
            </div>

            <div class="form-group">
                <label for="passwordConfirm">パスワード（確認） *</label>
                <input type="password" id="passwordConfirm" required placeholder="もう一度パスワードを入力" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary">登録</button>
        </form>

        <div class="divider">または</div>

        <button class="btn btn-secondary" onclick="location.href='login.html'">既にアカウントをお持ちの方</button>
    </div>

    <script>
        const API_URL = 'https://entry-notification.entry-notify-system.workers.dev';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            // パスワード確認
            if (password !== passwordConfirm) {
                showMessage('パスワードが一致しません', 'error');
                return;
            }

            // パスワード長確認
            if (password.length < 6) {
                showMessage('パスワードは6文字以上で入力してください', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // トークンとユーザー情報を保存
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('classroom', JSON.stringify(data.classroom));

                    showMessage('登録が完了しました！', 'success');

                    // 管理画面にリダイレクト
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    showMessage(data.error || '登録に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('登録に失敗しました: ' + error.message, 'error');
            }
        });

        function showMessage(message, type) {
            const el = document.getElementById('message');
            el.textContent = message;
            el.className = `message ${type}`;
            el.style.display = 'block';
        }

        // 既にログイン済みの場合は管理画面にリダイレクト
        if (localStorage.getItem('token')) {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
